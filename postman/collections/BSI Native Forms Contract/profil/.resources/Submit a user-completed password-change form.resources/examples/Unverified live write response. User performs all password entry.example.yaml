$kind: http-example
name: Unverified live write response. User performs all password entry and final submission in the app.
request:
  url: "{{baseUrl}}/profil/update"
  method: POST
  headers:
    - key: mybest_session
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: urlencoded
    content:
      - key: _token
        value: string
        disabled: false
        description: "(Required) "
      - key: _method
        value: patch
        disabled: false
        description: "(Required) "
      - key: current_password
        value: string
        disabled: false
        description: "(Required) "
      - key: password
        value: stringstring
        disabled: false
        description: "(Required) "
      - key: password_confirmation
        value: string
        disabled: false
        description: "(Required) "
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 1000
