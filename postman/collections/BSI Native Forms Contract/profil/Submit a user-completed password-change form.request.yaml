$kind: http-request
description: "Observed requirements: at least 8 characters with uppercase, lowercase, digit and symbol; confirmation must match."
url: "{{baseUrl}}/profil/update"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    - key: _token
      value: "{{csrfToken}}"
      disabled: false
      description: "(Required) "
    - key: _method
      value: patch
      disabled: false
      description: "(Required) "
    - key: current_password
      value: "{{currentPassword}}"
      disabled: false
      description: "(Required) "
    - key: password
      value: "{{password}}"
      disabled: false
      description: "(Required) "
    - key: password_confirmation
      value: "{{passwordConfirmation}}"
      disabled: false
      description: "(Required) "
settings: {}
examples: ./.resources/Submit a user-completed password-change form.resources/examples
order: 2000
