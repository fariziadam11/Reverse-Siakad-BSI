$kind: http-example
name: Expected download from the observed Unduh form; stream the response and verify content disposition/type rather than parsing binary as HTML.
request:
  url: "{{baseUrl}}/download-file-tugas"
  method: POST
  headers:
    - key: mybest_session
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: urlencoded
    content:
      - key: _token
        value: string
        disabled: false
        description: "(Required) "
      - key: id
        value: string
        disabled: false
        description: "(Required) "
      - key: file
        value: string
        disabled: false
        description: "(Required) "
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 1000
