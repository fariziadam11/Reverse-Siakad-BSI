$kind: http-example
name: Logout form observed. Clear Student V2 cookies locally after logout; preserve e-learning cookies.
request:
  url: "{{baseUrl}}/logout"
  method: POST
  headers:
    - key: s_i_a_k_a_d-_universitas_bina_sarana_informatika_session
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: urlencoded
    content:
      - key: _token
        value: string
        disabled: false
        description: "(Required) "
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 1000
