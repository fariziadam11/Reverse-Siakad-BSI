$kind: http-request
description: Form observed only. Remote mutation and status codes were not exercised. Never automatically replay.
url: "{{baseUrl}}/mahasiswa/password"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    - key: _token
      value: "{{csrfToken}}"
      disabled: false
      description: "(Required) "
    - key: current_password
      value: "{{currentPassword}}"
      disabled: false
      description: "(Required) "
    - key: new_password
      value: "{{newPassword}}"
      disabled: false
      description: "(Required) "
    - key: new_password_confirmation
      value: "{{newPasswordConfirmation}}"
      disabled: false
      description: "(Required) "
auth:
  type: noauth
settings: {}
examples: ./.resources/Submit a user-confirmed password change.resources/examples
order: 2000
