$kind: http-example
name: Observed redirect to /dashboard then /mahasiswa/beranda. Preserve rotated cookies; verify authenticated sidebar.
request:
  url: "{{baseUrl}}/login"
  method: POST
  body:
    type: urlencoded
    content:
      - key: _token
        value: string
        disabled: false
        description: "(Required) "
      - key: username
        value: string
        disabled: false
        description: "(Required) "
      - key: password
        value: string
        disabled: false
        description: "(Required) "
      - key: remember
        value: string
        disabled: false
        description: Optional server Remember me control; only sent after user selection.
response:
  statusCode: 302
  statusText: Found
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 2000
