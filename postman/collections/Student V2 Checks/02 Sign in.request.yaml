$kind: http-request
url: '{{baseUrl}}/login'
method: POST
order: 2000
headers:
  - key: Cookie
    value: '{{sessionCookie}}'
settings:
  followRedirects: false
body:
  type: urlencoded
  content:
    - {key: _token, value: STUDENT_TEST_CSRF}
    - {key: username, value: test-student}
    - {key: password, value: test-password}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Student login redirects and rotates the cookie', function () {
        pm.response.to.have.status(302);
        pm.expect(pm.response.headers.get('Location')).to.include('/dashboard');
        var cookie = pm.response.headers.get('Set-Cookie').split(';')[0];
        pm.expect(cookie).not.to.eql(pm.collectionVariables.get('sessionCookie'));
        pm.collectionVariables.set('sessionCookie', cookie);
      });
