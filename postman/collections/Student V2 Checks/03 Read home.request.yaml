$kind: http-request
url: '{{baseUrl}}/mahasiswa/beranda'
method: GET
order: 3000
headers:
  - key: Cookie
    value: '{{sessionCookie}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Authenticated Student home exposes identity and account menu', function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.text()).to.include('student-sidebar-profile__name');
        pm.expect(pm.response.text()).to.include('/mahasiswa/krs');
      });
