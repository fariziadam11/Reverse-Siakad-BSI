$kind: http-example
name: Form redisplayed; inspect server validation messages.
request:
  url: "{{baseUrl}}/login"
  method: POST
  body:
    type: urlencoded
    content:
      - key: _token
        value: string
        disabled: false
        description: (Required) Hidden CSRF token from the current form.
      - key: username
        value: string
        disabled: false
        description: (Required) User-supplied NIP or NIM.
      - key: password
        value: string
        disabled: false
        description: (Required) User-supplied password.
      - key: captcha_answer
        value: str
        disabled: false
        description: (Required) Code from the current security image.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 1000
