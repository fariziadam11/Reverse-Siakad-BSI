$kind: http-request
description: The user supplies the security code. Preserve cookies from GET and POST. A redirect alone does not prove success; verify the student dashboard.
url: "{{baseUrl}}/login"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    - key: _token
      value: "{{csrfToken}}"
      disabled: false
      description: (Required) Hidden CSRF token from the current form.
    - key: username
      value: "{{username}}"
      disabled: false
      description: (Required) User-supplied NIP or NIM.
    - key: password
      value: "{{password}}"
      disabled: false
      description: (Required) User-supplied password.
    - key: captcha_answer
      value: "{{captchaAnswer}}"
      disabled: false
      description: (Required) Code from the current security image.
settings: {}
examples: ./.resources/Submit the login form.resources/examples
order: 2000
