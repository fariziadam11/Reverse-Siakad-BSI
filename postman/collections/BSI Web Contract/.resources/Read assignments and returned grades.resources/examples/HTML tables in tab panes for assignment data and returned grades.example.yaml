$kind: http-example
name: HTML tables in tab panes for assignment data and returned grades. Submission and POST-only downloads use the official page.
request:
  url: "{{baseUrl}}/assignment/:opaqueId"
  method: GET
  headers:
    - key: mybest_session
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    - key: opaqueId
      value: string
      disabled: false
      description: (Required) Exact encrypted ID from the authenticated schedule; do not decode or synthesize it.
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 1000
