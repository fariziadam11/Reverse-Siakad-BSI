$kind: http-example
name: Browser form response; exact remote status remains unverified.
request:
  url: "{{baseUrl}}/logout"
  method: POST
  headers:
    - key: mybest_session
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: urlencoded
    content:
      - key: _token
        value: string
        disabled: false
        description: "(Required) "
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 1000
