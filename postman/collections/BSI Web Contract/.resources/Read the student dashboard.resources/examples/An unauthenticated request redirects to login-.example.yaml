$kind: http-example
name: An unauthenticated request redirects to login.
request:
  url: "{{baseUrl}}/user/dashboard"
  method: GET
  headers:
    - key: mybest_session
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: text
    content: ""
response:
  statusCode: 302
  statusText: Found
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 2000
